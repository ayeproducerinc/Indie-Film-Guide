openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
    post:
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLogin" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
    delete:
      operationId: logoutAdmin
      responses:
        "204": { description: Signed out }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: Private listings and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
  /admin/listings:
    post:
      operationId: addAdminListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Added pending listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListing" }
  /admin/listings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateAdminListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListing" }
    delete:
      operationId: deleteAdminListing
      responses:
        "204": { description: Deleted listing }
  /admin/listings/{id}/status:
    post:
      operationId: setAdminListingStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingStatusInput" }
      responses:
        "200":
          description: Updated review status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListing" }
  /admin/listings/{id}/verify-ein:
    post:
      operationId: verifyAdminListingEin
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EinVerificationInput" }
      responses:
        "200":
          description: EIN marked verified by the administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListing" }
        "409":
          description: Saved EIN or provider type changed; review again
  /admin/listings/{id}/checkout:
    post:
      operationId: createAdminListingCheckout
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Listing-specific Stripe checkout link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
  /admin/listings/{id}/renewal-plan:
    get:
      operationId: previewAdminRenewalPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Current subscription and renewal-only Standard price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewalPlanPreview" }
    post:
      operationId: scheduleAdminRenewalPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewalPlanInput" }
      responses:
        "200":
          description: Confirmed Standard plan change at renewal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListing" }
  /submissions/{reference}/status:
    post:
      operationId: getSubmissionStatus
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentAccess" }
      responses:
        "200":
          description: Current saved submission state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionState" }
  /submissions/{reference}/checkout:
    post:
      operationId: createListingCheckout
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentAccess" }
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
  /directory:
    get:
      operationId: getDirectory
      responses:
        "200":
          description: Live directory and filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
  /listings/{slug}:
    get:
      operationId: getListing
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public listing with email only when consented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /locations:
    get:
      operationId: getLocations
      responses:
        "200":
          description: Canonical Georgia cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
  /submissions:
    post:
      operationId: submitListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Saved pending submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
  /listing-config:
    get:
      operationId: getListingConfig
      responses:
        "200":
          description: Launch special and billing availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingConfig" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Location:
      type: object
      required: [id, city, state]
      properties:
        id: { type: string }
        city: { type: string }
        state: { type: string }
    Listing:
      type: object
      required: [id, slug, name, description, category, stages, city, state, coverage, providerType, indieRate, indieRateDetails, website, phone]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        stages: { type: array, items: { type: string } }
        city: { type: string }
        state: { type: string }
        coverage: { type: string, enum: [City, Statewide, Nationwide] }
        providerType: { type: string, enum: [Business, Nonprofit, Government] }
        indieRate: { type: boolean }
        indieRateDetails: { type: string }
        indiePromoCode: { type: string }
        indieRedeemHow: { type: string }
        indieWhoQualifies: { type: string }
        website: { type: string }
        phone: { type: string }
        email: { type: string }
    Directory:
      type: object
      required: [listings, cities, categories, stages]
      properties:
        listings: { type: array, items: { $ref: "#/components/schemas/Listing" } }
        cities: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        stages: { type: array, items: { type: string } }
    ListingInput:
      type: object
      required: [name, description, category, stages, coverage, website, phone, email, providerType, plan]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, enum: [Locations, Equipment & Props, "Talent, Crew & On-Set", Business Services & Licensing, Funding & Banking, Distribution & Marketing] }
        stages:
          type: array
          minItems: 1
          items: { type: string, enum: [Idea, Production, Post-Production, Distribution] }
        coverage: { type: string, enum: [City, Statewide, Nationwide] }
        locationId: { type: string }
        website: { type: string, minLength: 1, maxLength: 500 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        publicEmail: { type: boolean, default: false }
        providerType: { type: string, enum: [Business, Nonprofit, Government] }
        plan: { type: string, enum: [Indie Partner, Standard, Lifetime Indie Partner, Nonprofit Indie Partner, Nonprofit Standard, Government] }
        indieRateDetails: { type: string, maxLength: 200 }
        indiePromoCode: { type: string, maxLength: 20 }
        indieRedeemHow: { type: string, maxLength: 120 }
        indieWhoQualifies: { type: string, maxLength: 120 }
        ein: { type: string, maxLength: 10 }
        einVerified: { type: boolean }
    Submission:
      type: object
      required: [reference, status, paymentStatus, message, accessToken]
      properties:
        reference: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        message: { type: string }
        accessToken: { type: string }
    ListingConfig:
      type: object
      required: [specialActive, billingAvailable, plans, lifetimeSpotsLeft]
      properties:
        specialActive: { type: boolean }
        billingAvailable: { type: boolean }
        billingMode: { type: string, enum: [test, live, unavailable] }
        plans: { type: array, items: { $ref: "#/components/schemas/PlanDefinition" } }
        lifetimeSpotsLeft: { type: integer, minimum: 0, maximum: 10 }
    PlanDefinition:
      type: object
      required: [name, providerType, amount, currency, billing, indie, lookupKey]
      properties:
        name: { type: string }
        providerType: { type: string, enum: [Business, Nonprofit, Government] }
        amount: { type: integer }
        currency: { type: string }
        billing: { type: string, enum: [yearly, lifetime, free] }
        indie: { type: boolean }
        lookupKey: { type: ["string", "null"] }
    RenewalPlanInput:
      type: object
      required: [confirmed, expectedEffectiveAt, expectedAmount]
      properties:
        confirmed: { type: boolean }
        expectedEffectiveAt: { type: string, format: date-time }
        expectedAmount: { type: integer }
    RenewalPlanPreview:
      type: object
      required: [currentPlan, targetPlan, currentAmount, targetAmount, effectiveAt]
      properties:
        currentPlan: { type: string }
        targetPlan: { type: string }
        currentAmount: { type: integer }
        targetAmount: { type: integer }
        effectiveAt: { type: string, format: date-time }
    AdminSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated: { type: boolean }
        configured: { type: boolean }
    AdminLogin:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1000 }
    PaymentAccess:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    CheckoutLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    SubmissionState:
      type: object
      required: [reference, name, plan, status, paymentStatus, foundingPriceLocked, checkoutAvailable, billingMode]
      properties:
        reference: { type: string }
        name: { type: string }
        plan: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        foundingPriceLocked: { type: boolean }
        checkoutAvailable: { type: boolean }
        billingMode: { type: string }
    EinVerificationInput:
      type: object
      required: [expectedEin]
      properties:
        expectedEin: { type: string, pattern: '^\d{2}-\d{7}$', maxLength: 10 }
    ListingStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Pending, Live, Rejected] }
    AdminListing:
      allOf:
        - $ref: "#/components/schemas/Listing"
        - type: object
          required: [reference, email, publicEmail, locationId, plan, status, paymentStatus, createdAt, foundingPriceLocked, stripeSubscriptionId]
          properties:
            reference: { type: string }
            email: { type: string }
            publicEmail: { type: boolean }
            locationId: { type: ["string", "null"] }
            plan: { type: string }
            status: { type: string }
            paymentStatus: { type: string }
            createdAt: { type: string }
            foundingPriceLocked: { type: boolean }
            stripeSubscriptionId: { type: ["string", "null"] }
            stripePaymentIntentId: { type: ["string", "null"] }
            stripeCheckoutId: { type: ["string", "null"] }
            stripePriceId: { type: ["string", "null"] }
            pendingPlan: { type: ["string", "null"] }
            pendingPlanAt: { type: ["string", "null"] }
            pastDueSince: { type: ["string", "null"] }
            graceDaysLeft: { type: integer }
            ein: { type: string }
            einVerified: { type: boolean }
    AdminDashboard:
      type: object
      required: [listings, liveCount, paidCount, recurringRevenue, lifetimeRevenue, lifetimeSpotsLeft, billingMode, paymentLinks]
      properties:
        listings: { type: array, items: { $ref: "#/components/schemas/AdminListing" } }
        liveCount: { type: integer }
        paidCount: { type: integer }
        recurringRevenue: { type: number }
        lifetimeRevenue: { type: number }
        lifetimeSpotsLeft: { type: integer }
        billingMode: { type: string }
        paymentLinks: { type: array, items: { $ref: "#/components/schemas/PlanPaymentLink" } }
    PlanPaymentLink:
      type: object
      required: [plan, url]
      properties:
        plan: { type: string }
        url: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

